# Development override for docker-compose.yml.
#
# Starts the server with your local src/ mounted live into the container so
# that edits to Python files are reflected immediately without rebuilding the
# image.  Also enables debug logging and disables the restart policy so the
# container stops cleanly when you Ctrl-C.
#
# Usage (always layer on top of the base file):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# To pass Instana credentials for stdio mode testing, copy .env.example to
# .env and fill in the values — Compose picks up .env automatically.

services:
  mcp-instana:
    # Stop at the builder stage so dev tools (gcc etc.) are available if needed.
    build:
      context: .
      target: builder
    # Mount src/ read-only so file changes are visible inside the running
    # container without a rebuild.  The installed packages from the builder
    # stage are already on site-packages; only src/ changes need this.
    volumes:
      - ./src:/app/src:ro
    # Enable debug transport flag for verbose MCP logging.
    command: ["--transport", "streamable-http", "--debug"]
    # Never auto-restart in dev — let it fail loudly.
    restart: "no"
    environment:
      LOG_LEVEL: "DEBUG"
